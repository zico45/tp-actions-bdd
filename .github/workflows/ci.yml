name: CI

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances
        run: pip install -r requirements.txt
        working-directory: python-app

      - name: Lancer les tests
        run: pytest -v
        working-directory: python-app

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci
        working-directory: node-app

      - name: Lancer les tests
        run: npm test
        working-directory: node-app

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build et tests
        run: mvn -B package
        working-directory: java-app

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql

      - name: Installer les dépendances
        run: composer install --no-interaction
        working-directory: php-app

      - name: Lancer les tests
        run: vendor/bin/phpunit tests
        working-directory: php-app

  build:
    runs-on: ubuntu-latest
    needs: [python, node, java, php]
    steps:
      - name: Build
        run: echo "Build réussi, les 4 jobs de tests sont verts"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Déploiement
        run: echo "Déploiement en cours"

      - name: Vérifier le secret
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: test -n "$TOKEN" && echo "Token présent"
